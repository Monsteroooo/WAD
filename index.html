<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вікторина</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Вікторина</h1>
        <nav>
            <ul>
                <li><a href="#поточне_питання">Питання</a></li>
                <li><a href="#історія_спроб">Результати</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="поточне_питання">
            <div class="quiz-progress-header">
                <h2 class="question-number">Список питань</h2>
                <p id="questions-count">Загальна кількість питань: 0</p>
                <div class="progress-bar-track" role="progressbar" aria-label="Прогрес вікторини" aria-valuenow="10" aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-bar-fill" style="width: 10%;"></div>
                </div>
            </div>
            
            <ul id="questions-list">
                <li class="answered" data-answer="Київ">Яке місто є столицею України?</li>
            </ul>
        </section>
        <section id="історія_спроб">
            <h2>Історія спроб</h2>
            <div class="cards">
                <article>
                    <h3>10.09.2026, Результат 8/10</h3>
                </article>
                <article>
                    <h3>8.09.2026, Результат 7/10</h3>
                </article>
                <article>
                    <h3>5.09.2026, Результат 9/10</h3>
                </article>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Вікторина. Даніч Володимир ІП-55</p>
    </footer>
<script src="js/app.js"></script>
</body>
</html>
